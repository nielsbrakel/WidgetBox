# Supply-chain policy (docs/decisions.md D-011): grouped minor/patch updates after a cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ['@biomejs/biome', '@playwright/test', 'homey']
    ignore:
      # Biome is bumped in its own PR with `biome migrate`; @playwright/test moves together with the
      # CI container image; the Homey CLI is bumped on its own because it validates every app.
      - dependency-name: '@biomejs/biome'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']
