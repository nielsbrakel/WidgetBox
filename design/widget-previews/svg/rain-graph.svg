<?xml version="1.0" encoding="UTF-8" ?>
<?xml-stylesheet href="theme.css" type="text/css" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Rain graph widget preview</title>
