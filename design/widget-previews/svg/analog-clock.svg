  <g class="s-mid" stroke-width="14">
    <line x1="512" y1="304" x2="512" y2="340" transform="rotate(30 512 512)" />
    <line x1="512" y1="304" x2="512" y2="340" transform="rotate(60 512 512)" />
    <line x1="512" y1="304" x2="512" y2="340" transform="rotate(120 512 512)" />
