<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    body {
      --text: var(--homey-text-color, #333);
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: var(--homey-font-family, system-ui, sans-serif);
      -webkit-tap-highlight-color: transparent;
    }

    .widget {
      margin: 0 auto;
    }

    .frame {
      position: relative;
      display: block;
      overflow: hidden;
      border: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      color: inherit;
      font: inherit;
      border-radius: var(--homey-border-radius-default, 12px);
      cursor: pointer;
    }

    .frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: top left;
      pointer-events: none;
    }

    .frame iframe.is-loading {
      visibility: hidden;
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      font-size: var(--homey-font-size-small, 14px);
      opacity: 0.8;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      height: 22px;
      padding: 0 8px;
      font-size: 11px;
    }

    .status {
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .credit {
      position: relative;
      flex: none;
      /* A 24px target (WCAG 2.5.8) without changing the layout. */
      padding: 6px 0;
      margin: -6px 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      opacity: 0.7;
      cursor: pointer;
    }

    .credit::after {
      content: "";
      position: absolute;
      inset: -12px -8px -6px;
    }

    [hidden] {
      display: none;
    }
    </style>
  </head>

  <body class="homey-widget">
    <div class="widget" id="app">
      <button class="frame" id="frame" type="button">
        <span class="message" id="message" role="status"></span>
      </button>
      <div class="footer">
        <span class="status" id="status"></span>
        <button class="credit" id="credit" type="button">Buienradar.nl</button>
      </div>
    </div>

    <script>
    const GADGET_URL = "https://gadgets.buienradar.nl/gadget/radarfivedays";
    const GADGET_WIDTH = 256;
    const GADGET_HEIGHT = 406;
    const MAX_WIDTH = 360;
    const FOOTER_HEIGHT = 22;
    const REFRESH_MS = 15 * 60 * 1000;
    const LOAD_TIMEOUT_MS = 20 * 1000;

    const $ = (id) => document.getElementById(id);

    function onHomeyReady(Homey) {
      const state = { width: 0, height: null, lastLoad: 0, timer: null, loadTimer: null };
      const translated = Homey.__("language");
      const language = /^[a-z]{2}$/.test(translated) ? translated : navigator.language;

      function t(key, tokens = {}) {
        const text = Homey.__(key) ?? key;
        return text.replace(/\{(\w+)\}/g, (_, name) => tokens[name] ?? "");
      }

      function formatClock(time) {
        return new Date(time).toLocaleTimeString(language, {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        });
      }

      /** Scales the fixed-size gadget to the widget width, capped so it does not get blurry. */
      function layout() {
        const body = getComputedStyle(document.body);
        const padX = parseFloat(body.paddingLeft) + parseFloat(body.paddingRight);
        const padY = parseFloat(body.paddingTop) + parseFloat(body.paddingBottom);
        const width = Math.min(document.body.clientWidth - padX, MAX_WIDTH);
        if (width === state.width || width === 0) return;
        state.width = width;
        const scale = width / GADGET_WIDTH;
        const frameHeight = Math.round(GADGET_HEIGHT * scale);
        $("app").style.width = `${width}px`;
        $("frame").style.height = `${frameHeight}px`;
        for (const iframe of $("frame").querySelectorAll("iframe")) {
          iframe.style.transform = `scale(${scale})`;
        }
        const height = frameHeight + FOOTER_HEIGHT + padY;
        if (height === state.height) return;
        if (state.height === null) Homey.ready({ height });
        else Homey.setHeight(height);
        state.height = height;
      }

      function createIframe() {
        const iframe = document.createElement("iframe");
        iframe.width = GADGET_WIDTH;
        iframe.height = GADGET_HEIGHT;
        iframe.title = t("widgets.rain-radar-5day.title");
        iframe.tabIndex = -1;
        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("sandbox", "");
        iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        iframe.style.transform = `scale(${state.width / GADGET_WIDTH})`;
        iframe.className = "is-loading";
        return iframe;
      }

      /** Loads a fresh copy next to the current one and swaps when it finished loading. */
      function refresh() {
        clearTimeout(state.timer);
        clearTimeout(state.loadTimer);
        const next = createIframe();
        next.addEventListener("load", () => {
          clearTimeout(state.loadTimer);
          for (const old of $("frame").querySelectorAll("iframe")) {
            if (old !== next) old.remove();
          }
          next.classList.remove("is-loading");
          $("message").hidden = true;
          state.lastLoad = Date.now();
          $("status").textContent = t("common.updated", { time: formatClock(state.lastLoad) });
          schedule();
        });
        state.loadTimer = setTimeout(() => {
          next.remove();
          if (state.lastLoad) {
            $("status").textContent = t("common.offline", { time: formatClock(state.lastLoad) });
          } else {
            $("message").textContent = `${t("common.errorTitle")}. ${t("common.errorRetry")}.`;
          }
          schedule();
        }, LOAD_TIMEOUT_MS);
        const params = new URLSearchParams({ t: String(Math.floor(Date.now() / REFRESH_MS)) });
        next.src = `${GADGET_URL}?${params}`;
        $("frame").append(next);
      }

      function schedule() {
        clearTimeout(state.timer);
        if (document.visibilityState === "hidden") return;
        const delay = Math.max(state.lastLoad + REFRESH_MS - Date.now(), 0);
        state.timer = setTimeout(refresh, state.lastLoad ? delay : REFRESH_MS / 3);
      }

      const openBuienradar = () => Homey.popup("https://www.buienradar.nl");
      $("frame").addEventListener("click", openBuienradar);
      $("credit").addEventListener("click", openBuienradar);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") clearTimeout(state.timer);
        else schedule();
      });

      document.documentElement.lang = language;
      $("frame").setAttribute("aria-label", t("widgets.rain-radar-5day.title"));
      $("message").textContent = t("common.loading");
      layout();
      new ResizeObserver(layout).observe(document.body);
      refresh();
    }

    window.onHomeyReady = onHomeyReady;
    </script>
  </body>
</html>
