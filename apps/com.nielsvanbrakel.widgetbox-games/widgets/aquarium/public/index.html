<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="is-loading">
      <canvas id="tank" aria-label="Aquarium"></canvas>

      <div id="hud">
        <div class="hud-left">
          <button type="button" class="pill" id="coinPill" data-ui="coins">
            <span class="ico" data-icon="coin"></span><span id="coinVal">0</span>
          </button>
          <button type="button" class="pill" id="pearlPill" data-ui="pearls">
            <span class="ico" data-icon="pearl"></span><span id="pearlVal">0</span>
          </button>
          <div id="chips"></div>
          <div id="coach" hidden></div>
        </div>
        <button type="button" id="levelBtn" class="level" data-ui="journal">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15.5" class="ring-bg" />
            <circle cx="18" cy="18" r="15.5" class="ring" id="levelRing" />
          </svg>
          <span id="levelVal">1</span>
          <span id="goalDot" class="dot" hidden></span>
        </button>
      </div>

      <div id="dock">
        <button type="button" class="dock-btn" data-ui="feed"><span class="ico" data-icon="food"></span><span class="lbl" data-t="dock.feed"></span></button>
        <button type="button" class="dock-btn" data-ui="play"><span class="ico" data-icon="play"></span><span class="lbl" data-t="dock.play"></span></button>
        <button type="button" class="dock-btn" data-ui="shop"><span class="ico" data-icon="shop"></span><span class="lbl" data-t="dock.shop"></span></button>
        <button type="button" class="dock-btn" data-ui="menu"><span class="ico" data-icon="menu"></span><span class="lbl" data-t="dock.menu"></span></button>
      </div>

      <div id="tray" hidden></div>
      <div id="card" hidden></div>
      <div id="toasts"></div>
      <div id="banner" hidden></div>

      <div id="sheet" hidden>
        <div class="sheet-head">
          <div class="sheet-title" id="sheetTitle"></div>
          <div class="sheet-meta" id="sheetMeta"></div>
          <button type="button" class="icon-btn" data-ui="close"><span class="ico" data-icon="close"></span></button>
        </div>
        <div class="tabs" id="sheetTabs"></div>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-foot" id="sheetFoot"></div>
      </div>

      <div id="modal" hidden></div>
      <div id="loading"><div class="spinner"></div></div>
    </div>

    <script src="catalog.js"></script>
    <script src="engine.js"></script>
    <script src="art.js"></script>
    <script src="scene.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
  </body>
</html>
