<html>
  <head>
    <style>
    .youtube-container iframe {
      border: none;
      width: 100%;
      height: 100%;
    }

    .ios-unsupported {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--homey-text-color, #333);
    }

    .ios-unsupported-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .ios-unsupported-message {
      font-size: 13px;
      opacity: 0.7;
      line-height: 1.4;
    }
    </style>
  </head>

  <body>
    <div id="youtube-container" class="youtube-container"></div>

    <script type="text/javascript">
    function isIOSDevice() {
      if (window.__SIMULATE_IOS__) return true;
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    // State of the widget
    let currentSettings = {};

    function getAspectRatioPercentage(aspectRatio) {
      const ratios = {
        "1:1": "100%",
        "4:3": "75%",
        "16:9": "56.25%",
        "9:16": "177.78%",
        "21:9": "42.86%",
        "3:1": "33.33%",
      };
      return ratios[aspectRatio];
    }

    function buildIframeUrl() {
      const baseUrl = "https://www.youtube-nocookie.com/embed";
      const playlistId = currentSettings.playlistId.trim();
      const videoId = currentSettings.videoId.trim();

      const params = new URLSearchParams();

      // If playlist is specified, use playlist mode
      let url;
      if (playlistId) {
        url = `${baseUrl}/videoseries`;
        params.append("list", playlistId);
      } else {
        url = `${baseUrl}/${videoId}`;
      }

      if (currentSettings.autoplay) {
        params.append("autoplay", "1");
        // Autoplay usually requires the video to be muted
        params.append("mute", "1");
      } else if (currentSettings.mute) {
        params.append("mute", "1");
      }

      if (!currentSettings.controls) {
        params.append("controls", "0");
      }
      if (currentSettings.loop) {
        params.append("loop", "1");
      }

      params.append("playsinline", "1");
      if (currentSettings.start > 0) {
        params.append("start", String(currentSettings.start));
      }

      params.append("fs", "1");

      const queryString = params.toString();
      return `${url}${queryString ? "?" + queryString : ""}`;
    }

    function render() {
      const content = document.getElementById("youtube-container");

      const iframeUrl = buildIframeUrl();

      const iframe = document.createElement("iframe");
      iframe.src = iframeUrl;
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;

      content.innerHTML = "";
      content.appendChild(iframe);
    }

    async function onHomeyReady(Homey) {
      currentSettings = Homey.getSettings();
      const heightPercentage = getAspectRatioPercentage(currentSettings.aspectRatio);

      if (isIOSDevice()) {
        const container = document.getElementById("youtube-container");
        container.innerHTML = `
          <div class="ios-unsupported">
            <div class="ios-unsupported-title">YouTube does not work on iOS dashboards yet</div>
            <div class="ios-unsupported-message">This is due to a limitation of the Homey app. The widget does work on android or web devices.</div>
          </div>
        `;
        Homey.ready({ height: heightPercentage });
        return;
      }

      render();

      Homey.ready({ height: heightPercentage });

      Homey.on("settings.set", (key, value) => {
        console.log("YouTube: settings.set", key, value);
        currentSettings[key] = value;
        const newHeightPercentage = getAspectRatioPercentage(currentSettings.aspectRatio);
        render();
        Homey.setHeight(newHeightPercentage);
      });
    }
    </script>
  </body>
</html>
