<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #player {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .facade {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: #000;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .facade img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-icon {
      position: relative;
      width: 68px;
      height: 48px;
      transition: transform 0.15s ease;
    }

    .facade:active .play-icon {
      transform: scale(0.92);
    }

    .facade:focus-visible {
      outline: 3px solid var(--homey-color-blue-500, #0099ff);
      outline-offset: -3px;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100%;
      padding: 16px;
      text-align: center;
    }

    .message-icon {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
      color: var(--homey-color-mono-400, #999);
    }

    .message-title {
      font-size: var(--homey-font-size-default, 17px);
      line-height: var(--homey-line-height-default, 24px);
      font-weight: var(--homey-font-weight-medium, 500);
    }

    .message-text {
      max-width: 32em;
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      color: var(--homey-text-color-light, var(--homey-color-mono-600, #666));
    }

    @media (prefers-reduced-motion: reduce) {
      .play-icon {
        transition: none;
      }
    }
    </style>
  </head>

  <body>
    <div id="player"></div>

    <template id="play-icon">
      <svg class="play-icon" viewBox="0 0 68 48" aria-hidden="true">
        <path
          d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2.3 34 .3 34 .3s-21.2 0-26.5 1.4a8.6 8.6 0 0 0-6 6C.1 13 .1 24 .1 24s0 11 1.4 16.3a8.6 8.6 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.6 8.6 0 0 0 6-6C67.9 35 67.9 24 67.9 24s0-11-1.4-16.3z"
          fill="#212121"
          fill-opacity="0.8"
        />
        <path d="M45 24 27 14v20z" fill="#fff" />
      </svg>
    </template>

    <template id="message-icon">
      <svg class="message-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="2.5"
          y="5"
          width="19"
          height="14"
          rx="3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor" />
      </svg>
    </template>

    <script type="text/javascript">
    const EMBED_ORIGIN = "https://www.youtube-nocookie.com";
    const VIDEO_ID = /^[\w-]{11}$/;
    const PLAYLIST_ID = /^(?:PL|UU|UL|LL|FL|RD|OL|PU|EL)[\w-]{10,}$/;
    const YOUTUBE_HOST = /(^|\.)(youtube\.com|youtube-nocookie\.com|youtu\.be)$/;
    const VIDEO_PATH = /^\/(?:shorts|live|embed|v)\/([\w-]{11})(?:[/?#]|$)/;
    const ASPECT_RATIOS = {
      "1:1": "100%",
      "4:3": "75%",
      "16:9": "56.25%",
      "9:16": "177.78%",
      "21:9": "42.86%",
      "3:1": "33.33%",
    };
    const DEFAULT_ASPECT_RATIO = "16:9";
    const SETTINGS_DEBOUNCE_MS = 150;

    function isIOSDevice() {
      if (window.__SIMULATE_IOS__) return true;
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    function getHeight(settings) {
      return ASPECT_RATIOS[settings.aspectRatio] || ASPECT_RATIOS[DEFAULT_ASPECT_RATIO];
    }

    function parseUrl(text) {
      if (!/youtu/i.test(text)) return null;
      try {
        return new URL(/^https?:\/\//i.test(text) ? text : `https://${text}`);
      } catch {
        return null;
      }
    }

    // "90", "90s", "1m30s" or "1h2m3s" -> seconds.
    function parseTimestamp(value) {
      const match = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(value || "");
      if (!match) return 0;
      const [, hours = 0, minutes = 0, seconds = 0] = match;
      return Number(hours) * 3600 + Number(minutes) * 60 + Number(seconds);
    }

    // Accepts a bare video or playlist ID, or any common YouTube link
    // (watch, youtu.be, shorts, live, embed and playlist links).
    function parseYouTubeInput(raw) {
      const text = String(raw ?? "").trim();
      if (!text) return { empty: true };
      if (VIDEO_ID.test(text)) return { videoId: text };
      if (PLAYLIST_ID.test(text)) return { playlistId: text };

      const url = parseUrl(text);
      if (!url || !YOUTUBE_HOST.test(url.hostname)) return { invalid: true };

      const params = url.searchParams;
      const shortId = url.hostname.endsWith("youtu.be") ? url.pathname.split("/")[1] : null;
      const candidate = shortId ?? params.get("v") ?? VIDEO_PATH.exec(url.pathname)?.[1];
      const videoId = VIDEO_ID.test(candidate ?? "") ? candidate : undefined;
      const list = params.get("list");
      const playlistId = PLAYLIST_ID.test(list ?? "") ? list : undefined;
      const start = parseTimestamp(params.get("t") ?? params.get("start"));

      if (!videoId && !playlistId) return { invalid: true };
      return { videoId, playlistId, start };
    }

    function resolveSource(settings) {
      const video = parseYouTubeInput(settings.videoId);
      const playlist = parseYouTubeInput(settings.playlistId);
      if (video.empty && playlist.empty) return { state: "empty" };
      if (video.invalid || playlist.invalid) return { state: "invalid" };

      const start = Math.max(0, Number.parseInt(settings.start, 10) || 0) || video.start || 0;
      return {
        state: "ready",
        videoId: video.videoId ?? playlist.videoId,
        playlistId: playlist.playlistId ?? video.playlistId,
        start,
      };
    }

    function buildEmbedUrl(source, settings, { autoplay }) {
      const { videoId, playlistId, start } = source;
      const path = videoId ? encodeURIComponent(videoId) : "videoseries";
      const params = new URLSearchParams();

      if (playlistId) params.set("list", playlistId);
      if (autoplay) params.set("autoplay", "1");
      // Browsers only allow autoplay without sound, so autoplay always mutes.
      if (settings.autoplay || settings.mute) params.set("mute", "1");
      if (!settings.controls) params.set("controls", "0");
      if (settings.loop) {
        params.set("loop", "1");
        // A single video only loops when it is also passed as its own playlist.
        if (!playlistId) params.set("playlist", videoId);
      }
      if (start > 0) params.set("start", String(start));
      params.set("playsinline", "1");
      params.set("rel", "0");
      params.set("enablejsapi", "1");
      if (/^https?:$/.test(location.protocol)) params.set("origin", location.origin);

      return `${EMBED_ORIGIN}/embed/${path}?${params}`;
    }

    function createWidget(Homey) {
      const container = document.getElementById("player");
      const t = (key) => Homey.__(`widgets.youtube.${key}`);
      let settings = Homey.getSettings();
      let height = getHeight(settings);
      let renderKey = "";
      let settingsTimer = null;

      function cloneTemplate(id) {
        return document.getElementById(id).content.firstElementChild.cloneNode(true);
      }

      function showMessage(titleKey, textKey) {
        const wrapper = document.createElement("div");
        wrapper.className = "message";
        wrapper.setAttribute("role", "status");
        const title = document.createElement("div");
        title.className = "message-title";
        title.textContent = t(titleKey);
        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = t(textKey);
        wrapper.append(cloneTemplate("message-icon"), title, text);
        container.replaceChildren(wrapper);
      }

      function showPlayer(source, autoplay) {
        const iframe = document.createElement("iframe");
        iframe.src = buildEmbedUrl(source, settings, { autoplay });
        iframe.title = t("playerTitle");
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        container.replaceChildren(iframe);
      }

      // Lightweight placeholder: the YouTube player only loads after a tap.
      function showFacade(source) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "facade";
        button.setAttribute("aria-label", t("play"));
        if (source.videoId) {
          const thumbnail = document.createElement("img");
          thumbnail.alt = "";
          thumbnail.src = `https://i.ytimg.com/vi/${encodeURIComponent(source.videoId)}/hqdefault.jpg`;
          thumbnail.addEventListener("error", () => thumbnail.remove(), { once: true });
          button.append(thumbnail);
        }
        button.append(cloneTemplate("play-icon"));
        button.addEventListener("click", () => showPlayer(source, true), { once: true });
        container.replaceChildren(button);
      }

      function render() {
        const source = resolveSource(settings);
        const key = JSON.stringify([
          source,
          settings.autoplay,
          settings.mute,
          settings.loop,
          settings.controls,
        ]);
        if (key === renderKey) return;
        renderKey = key;

        if (source.state === "empty") showMessage("emptyTitle", "emptyMessage");
        else if (source.state === "invalid") showMessage("invalidTitle", "invalidMessage");
        else if (settings.autoplay) showPlayer(source, true);
        else showFacade(source);
      }

      function updateHeight() {
        const nextHeight = getHeight(settings);
        if (nextHeight === height) return;
        height = nextHeight;
        Homey.setHeight(height);
      }

      function sendPlayerCommand(func) {
        const iframe = container.querySelector("iframe");
        iframe?.contentWindow?.postMessage(
          JSON.stringify({ event: "command", func, args: [] }),
          EMBED_ORIGIN,
        );
      }

      // Wall tablets keep dashboards open for days: stop decoding video while
      // the dashboard is hidden and resume autoplaying videos when it returns.
      function onVisibilityChange() {
        if (document.visibilityState === "hidden") sendPlayerCommand("pauseVideo");
        else if (settings.autoplay) sendPlayerCommand("playVideo");
      }

      function onSettingsChanged(key, value) {
        settings = { ...settings, [key]: value };
        clearTimeout(settingsTimer);
        settingsTimer = setTimeout(() => {
          render();
          updateHeight();
        }, SETTINGS_DEBOUNCE_MS);
      }

      return {
        start() {
          if (isIOSDevice()) {
            showMessage("iosTitle", "iosMessage");
            Homey.ready({ height });
            return;
          }
          render();
          Homey.ready({ height });
          Homey.on("settings.set", onSettingsChanged);
          document.addEventListener("visibilitychange", onVisibilityChange);
        },
      };
    }

    window.onHomeyReady = (Homey) => {
      createWidget(Homey).start();
    };
    </script>
  </body>
</html>
