<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      height: 100%;
      overflow: hidden;
      font-family: var(--homey-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
    }

    .header-text {
      width: 100%;
      color: var(--homey-text-color, #333);
    }
  </style>
</head>

<body>
  <div class="header-text" id="header"></div>

  <script type="text/javascript">
    const SIZE_MAP = { xsmall: '12px', small: '14px', medium: '18px', large: '24px', xlarge: '32px' };
    const HEIGHT_MAP = { xsmall: 24, small: 32, medium: 40, large: 48, xlarge: 56 };
    const WEIGHT_MAP = { thin: '300', normal: 'normal', bold: 'bold' };
    const VALID_ALIGNS = ['left', 'center', 'right'];
    const COLOR_MAP = {
      default: '',
      blue: '#3B82F6',
      green: '#22C55E',
      orange: '#F97316',
      red: '#EF4444',
      purple: '#A855F7',
    };

    function render(settings) {
      const el = document.getElementById('header');
      el.textContent = settings.text || '';
      el.style.fontSize = SIZE_MAP[settings.size] || SIZE_MAP.medium;
      el.style.fontWeight = WEIGHT_MAP[settings.fontWeight] || 'bold';
      el.style.textAlign = VALID_ALIGNS.includes(settings.horizontalAlignment) ? settings.horizontalAlignment : 'left';
      el.style.color = COLOR_MAP[settings.color] || '';
    }

    function getHeight(settings) {
      return HEIGHT_MAP[settings.size] || HEIGHT_MAP.medium;
    }

    function onHomeyReady(Homey) {
      const settings = Homey.getSettings();
      render(settings);
      Homey.ready({ height: getHeight(settings) });

      Homey.on('settings.set', (key, value) => {
        settings[key] = value;
        render(settings);
        Homey.setHeight(getHeight(settings));
      });
    }
  </script>
</body>

</html>
