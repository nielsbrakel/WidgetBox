<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
    }
    </style>
  </head>

  <body>
    <div id="divider"></div>

    <script type="text/javascript">
    function getHeightPixels(settings) {
      const h = parseInt(settings.height, 10);
      return Number.isFinite(h) ? Math.max(0, h) : 32;
    }

    function onHomeyReady(Homey) {
      const settings = Homey.getSettings();
      Homey.ready({ height: getHeightPixels(settings) });

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        Homey.setHeight(getHeightPixels(settings));
      });
    }
    </script>
  </body>
</html>
