<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .line {
      flex: 1;
      height: 0;
      border: none;
    }
    </style>
  </head>

  <body>
    <hr class="line" id="line">

    <script type="text/javascript">
    const VALID_STYLES = ["solid", "dashed", "dotted"];
    const COLOR_MAP = {
      default: "var(--homey-color-mono-300, #b3b3b3)",
      blue: "var(--homey-color-blue-500, #0099ff)",
      green: "var(--homey-color-green-500, #26c281)",
      orange: "var(--homey-color-orange-500, #ff9500)",
      red: "var(--homey-color-red-500, #ff3b30)",
      purple: "var(--homey-color-purple-500, #a855f7)",
    };

    function clampInt(value, min, max, fallback) {
      const number = Number.parseInt(value, 10);
      return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
    }

    function render(settings) {
      const el = document.getElementById("line");
      const color = COLOR_MAP[settings.color] || COLOR_MAP.default;
      const thickness = clampInt(settings.thickness, 1, 4, 1);
      const style = VALID_STYLES.includes(settings.style) ? settings.style : "solid";
      const margin = clampInt(settings.margin, 0, 200, 16);

      el.style.borderTop = `${thickness}px ${style} ${color}`;
      el.style.margin = `0 ${margin}px`;
    }

    window.onHomeyReady = (Homey) => {
      const settings = Homey.getSettings();
      render(settings);
      Homey.ready();

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        render(settings);
      });
    };
    </script>
  </body>
</html>
