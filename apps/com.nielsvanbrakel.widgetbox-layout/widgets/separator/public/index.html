<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }

    .line {
      width: 100%;
    }
    </style>
  </head>

  <body>
    <hr class="line" id="line">

    <script type="text/javascript">
    const VALID_STYLES = ["solid", "dashed", "dotted"];
    const COLOR_MAP = {
      default: "#CCCCCC",
      blue: "#3B82F6",
      green: "#22C55E",
      orange: "#F97316",
      red: "#EF4444",
      purple: "#A855F7",
    };

    function render(settings) {
      const el = document.getElementById("line");
      const color = COLOR_MAP[settings.color] || COLOR_MAP.default;
      const thickness = Math.max(1, Math.min(10, parseInt(settings.thickness, 10) || 1));
      const style = VALID_STYLES.includes(settings.style) ? settings.style : "solid";
      const margin = Math.max(0, Math.min(200, parseInt(settings.margin, 10) || 0));

      el.style.border = "none";
      el.style.borderTop = `${thickness}px ${style} ${color}`;
      el.style.margin = `0 ${margin}px`;
    }

    function onHomeyReady(Homey) {
      const settings = Homey.getSettings();
      render(settings);
      Homey.ready({ height: 24 });

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        render(settings);
      });
    }
    </script>
  </body>
</html>
