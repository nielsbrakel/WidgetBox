<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      box-sizing: border-box;
      padding: var(--homey-su-3, 12px) var(--homey-su-4, 16px);
      --accent: var(--homey-text-color, #333);
      --font-size: 24px;
      --font-weight: normal;
      text-align: center;
    }

    .align-left {
      text-align: left;
    }

    .align-right {
      text-align: right;
    }

    .size-xsmall {
      --font-size: 14px;
    }

    .size-small {
      --font-size: 18px;
    }

    .size-large {
      --font-size: 32px;
    }

    .size-xlarge {
      --font-size: 42px;
    }

    .weight-thin {
      --font-weight: 300;
    }

    .weight-bold {
      --font-weight: bold;
    }

    .color-blue {
      --accent: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --accent: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --accent: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --accent: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --accent: var(--homey-color-purple-500, #a855f7);
    }

    .time-text {
      margin: 0;
      font-size: min(var(--font-size), 13vw);
      font-weight: var(--font-weight);
      line-height: 1.3;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    .muted {
      opacity: 0.6;
    }

    .highlight {
      color: var(--accent);
      font-weight: 800;
    }
    </style>
  </head>

  <body class="homey-widget-full">
    <div id="app">
      <p class="time-text" id="time-text" role="timer" aria-live="off"></p>
    </div>

    <script src="word-clock.js"></script>
    <script>
    const WIDGET_ID = "word-clock-sentence";
    const SUPPORTED_LANGUAGES = ["en", "nl"];
    const MINUTE = 60 * 1000;

    const app = document.getElementById("app");
    const timeText = document.getElementById("time-text");

    let settings = {};
    let homeyLanguage = null;
    let renderedKey = "";

    function resolveLanguage() {
      if (SUPPORTED_LANGUAGES.includes(settings.language)) return settings.language;
      if (SUPPORTED_LANGUAGES.includes(homeyLanguage)) return homeyLanguage;
      return navigator.language?.toLowerCase().startsWith("nl") ? "nl" : "en";
    }

    function createWordNode(word) {
      const span = document.createElement("span");
      span.className = word.highlight ? "highlight" : "muted";
      span.textContent = word.text;
      return span;
    }

    function render() {
      const language = resolveLanguage();
      const now = new Date();
      const words = WordClockSentence.getSentence(language, now.getHours(), now.getMinutes());
      const key = `${language}:${words.map((word) => word.text).join(" ")}`;
      if (key === renderedKey) return;
      renderedKey = key;

      const nodes = [];
      words.forEach((word, index) => {
        if (index > 0) nodes.push(document.createTextNode(" "));
        nodes.push(createWordNode(word));
      });
      timeText.replaceChildren(...nodes);
      document.documentElement.lang = language;
    }

    function applySettings() {
      app.className = [
        `size-${settings.size || "medium"}`,
        `weight-${settings.fontWeight || "normal"}`,
        `color-${settings.color || "default"}`,
        `align-${settings.horizontalAlignment || "center"}`,
      ].join(" ");
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    function createMinuteTicker(tick) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        timer = setTimeout(run, MINUTE - (Date.now() % MINUTE) + 50);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      homeyLanguage = Homey.__(`widgets.${WIDGET_ID}.language`);

      const reportHeight = createHeightReporter(Homey);
      const ticker = createMinuteTicker(render);

      applySettings();
      ticker.start();
      reportHeight();
      new ResizeObserver(reportHeight).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        render();
      });
    };
    </script>
  </body>
</html>
