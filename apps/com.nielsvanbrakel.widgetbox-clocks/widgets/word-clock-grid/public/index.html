<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      box-sizing: border-box;
      padding: var(--homey-su-3, 12px) var(--homey-su-4, 16px);
      --accent: var(--homey-text-color, #333);
      --max-width: 260px;
      display: flex;
      justify-content: center;
    }

    .align-left {
      justify-content: flex-start;
    }

    .align-right {
      justify-content: flex-end;
    }

    .size-xsmall {
      --max-width: 140px;
    }

    .size-small {
      --max-width: 200px;
    }

    .size-large {
      --max-width: 340px;
    }

    .size-xlarge {
      --max-width: 100%;
    }

    .color-blue {
      --accent: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --accent: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --accent: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --accent: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --accent: var(--homey-color-purple-500, #a855f7);
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      width: min(var(--max-width), 100%);
      min-width: 0;
      aspect-ratio: 1;
      line-height: 1;
      font-weight: 600;
      text-transform: uppercase;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.15;
      transition:
        opacity 0.4s ease,
        color 0.4s ease;
    }

    .cell.active {
      opacity: 1;
      font-weight: 800;
      color: var(--accent);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .cell {
        transition: none;
      }
    }
    </style>
  </head>

  <body class="homey-widget-full">
    <div id="app">
      <div class="matrix" id="matrix" aria-hidden="true"></div>
      <p class="visually-hidden" id="spoken-time" role="timer" aria-live="off"></p>
    </div>

    <script src="word-clock.js"></script>
    <script>
    const WIDGET_ID = "word-clock-grid";
    const SUPPORTED_LANGUAGES = ["en", "nl"];
    const MINUTE = 60 * 1000;

    const app = document.getElementById("app");
    const matrix = document.getElementById("matrix");
    const spokenTime = document.getElementById("spoken-time");

    let settings = {};
    let homeyLanguage = null;
    let renderedLanguage = null;
    let renderedWordsKey = "";
    let cells = [];

    function resolveLanguage() {
      if (SUPPORTED_LANGUAGES.includes(settings.language)) return settings.language;
      if (SUPPORTED_LANGUAGES.includes(homeyLanguage)) return homeyLanguage;
      return navigator.language?.toLowerCase().startsWith("nl") ? "nl" : "en";
    }

    function buildMatrix(language) {
      const fragment = document.createDocumentFragment();
      cells = [];
      for (const row of WordClockGrid.GRIDS[language].rows) {
        for (const letter of row) {
          const cell = document.createElement("span");
          cell.className = "cell";
          cell.textContent = letter;
          cells.push(cell);
          fragment.appendChild(cell);
        }
      }
      matrix.replaceChildren(fragment);
      document.documentElement.lang = language;
      renderedLanguage = language;
      renderedWordsKey = "";
    }

    function spokenWords(wordIds) {
      return wordIds.map((id) => id.split("_")[0].toLowerCase()).join(" ");
    }

    function render() {
      const language = resolveLanguage();
      if (language !== renderedLanguage) buildMatrix(language);

      const now = new Date();
      const wordIds = WordClockGrid.getActiveWords(language, now.getHours(), now.getMinutes());
      const wordsKey = wordIds.join(" ");
      if (wordsKey === renderedWordsKey) return;
      renderedWordsKey = wordsKey;

      const activeCells = WordClockGrid.getActiveCells(language, wordIds);
      cells.forEach((cell, index) => {
        cell.classList.toggle("active", activeCells.has(index));
      });
      spokenTime.textContent = spokenWords(wordIds);
    }

    function applySettings() {
      app.className = [
        `size-${settings.size || "medium"}`,
        `color-${settings.color || "default"}`,
        `align-${settings.horizontalAlignment || "center"}`,
      ].join(" ");
    }

    function fitFontSize() {
      matrix.style.fontSize = `${(matrix.clientWidth / 10) * 0.55}px`;
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    function createMinuteTicker(tick) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        timer = setTimeout(run, MINUTE - (Date.now() % MINUTE) + 50);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      homeyLanguage = Homey.__(`widgets.${WIDGET_ID}.language`);

      const reportHeight = createHeightReporter(Homey);
      const ticker = createMinuteTicker(render);

      applySettings();
      ticker.start();
      fitFontSize();
      reportHeight();

      let observedWidth = matrix.clientWidth;
      new ResizeObserver(() => {
        if (matrix.clientWidth !== observedWidth) {
          observedWidth = matrix.clientWidth;
          fitFontSize();
        }
        reportHeight();
      }).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        render();
      });
    };
    </script>
  </body>
</html>
