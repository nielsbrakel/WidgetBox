<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      box-sizing: border-box;
      padding: var(--homey-su-3, 12px) var(--homey-su-4, 16px);
      --accent: var(--homey-text-color, #333);
      --max-size: 128px;
      display: flex;
      justify-content: center;
    }

    .align-left {
      justify-content: flex-start;
    }

    .align-right {
      justify-content: flex-end;
    }

    .size-xsmall {
      --max-size: 64px;
    }

    .size-small {
      --max-size: 96px;
    }

    .size-large {
      --max-size: 192px;
    }

    .size-xlarge {
      --max-size: 256px;
    }

    .color-blue {
      --accent: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --accent: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --accent: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --accent: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --accent: var(--homey-color-purple-500, #a855f7);
    }

    [hidden] {
      display: none;
    }

    svg {
      display: block;
      width: min(var(--max-size), 100%);
      height: auto;
      aspect-ratio: 1;
      overflow: visible;
    }

    .face {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      opacity: 0.25;
    }

    .marker {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .marker.minor {
      stroke-width: 1;
      opacity: 0.5;
    }

    .style-swiss .marker {
      stroke-linecap: butt;
    }

    .style-swiss .marker.major {
      stroke-width: 3;
    }

    .number {
      fill: currentColor;
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .date-box {
      fill: currentColor;
      fill-opacity: 0.1;
    }

    .date-text {
      fill: currentColor;
      font-size: 7px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      font-variant-numeric: tabular-nums;
    }

    .hand {
      stroke: currentColor;
      stroke-linecap: round;
    }

    .hand.hour {
      stroke-width: 4;
    }

    .hand.minute {
      stroke-width: 2.5;
    }

    .style-swiss .hand.hour,
    .style-swiss .hand.minute {
      stroke-linecap: butt;
    }

    .style-swiss .hand.hour {
      stroke-width: 5;
    }

    .style-swiss .hand.minute {
      stroke-width: 3.5;
    }

    .second-hand {
      stroke: var(--accent);
      fill: var(--accent);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .center-cap {
      fill: currentColor;
    }

    .has-seconds .center-cap {
      fill: var(--accent);
    }
    </style>
  </head>

  <body class="homey-widget-full">
    <div id="app">
      <svg viewBox="0 0 100 100" id="clock-svg" role="img" aria-labelledby="clock-title">
        <title id="clock-title">Clock</title>
        <circle class="face" cx="50" cy="50" r="48" />
        <g id="markers"></g>
        <g id="date-group" hidden>
          <rect class="date-box" x="66" y="45" width="18" height="10" rx="2" />
          <text class="date-text" id="date-text" x="75" y="50.5"></text>
        </g>
        <line id="hour-hand" class="hand hour" x1="50" y1="54" x2="50" y2="26" />
        <line id="minute-hand" class="hand minute" x1="50" y1="56" x2="50" y2="12" />
        <g id="second-hand" class="second-hand" hidden>
          <line x1="50" y1="62" x2="50" y2="10" />
          <circle id="second-tip" cx="50" cy="14" r="3.5" hidden />
        </g>
        <circle class="center-cap" cx="50" cy="50" r="2.5" />
      </svg>
    </div>

    <script>
    const WIDGET_ID = "analog-clock";
    const SVG_NS = "http://www.w3.org/2000/svg";
    const SECOND = 1000;
    const MINUTE = 60 * SECOND;
    const SMALL_SIZES = ["xsmall", "small"];

    const app = document.getElementById("app");
    const clockTitle = document.getElementById("clock-title");
    const markers = document.getElementById("markers");
    const dateGroup = document.getElementById("date-group");
    const dateText = document.getElementById("date-text");
    const hourHand = document.getElementById("hour-hand");
    const minuteHand = document.getElementById("minute-hand");
    const secondHand = document.getElementById("second-hand");
    const secondTip = document.getElementById("second-tip");

    let settings = {};
    let locale = "en";
    let renderedMinute = -1;

    function polar(angle, radius) {
      const radians = (angle * Math.PI) / 180;
      return { x: 50 + radius * Math.sin(radians), y: 50 - radius * Math.cos(radians) };
    }

    function createMarker(angle, outer, inner, className) {
      const from = polar(angle, outer);
      const to = polar(angle, inner);
      const line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("x1", from.x.toFixed(2));
      line.setAttribute("y1", from.y.toFixed(2));
      line.setAttribute("x2", to.x.toFixed(2));
      line.setAttribute("y2", to.y.toFixed(2));
      line.setAttribute("class", className);
      return line;
    }

    function createNumber(hour) {
      const point = polar(hour * 30, 37);
      const text = document.createElementNS(SVG_NS, "text");
      text.setAttribute("x", point.x.toFixed(2));
      text.setAttribute("y", point.y.toFixed(2));
      text.setAttribute("class", "number");
      text.textContent = String(hour);
      return text;
    }

    /** Builds the dial for the chosen style. Minute 15 (3 o'clock) is left free for the date. */
    function drawDial(style, showDate) {
      const nodes = [];
      const isFree = (minute) => showDate && minute === 15;

      for (let minute = 0; minute < 60; minute += 1) {
        if (isFree(minute)) continue;
        const angle = minute * 6;
        const isHour = minute % 5 === 0;

        if (style === "minimal") {
          if (minute % 15 === 0) nodes.push(createMarker(angle, 45, 39, "marker major"));
        } else if (style === "modern") {
          if (isHour) nodes.push(createMarker(angle, 45, 37, "marker major"));
        } else if (style === "classic") {
          if (isHour) nodes.push(createNumber(minute / 5 || 12));
          else nodes.push(createMarker(angle, 46, 44, "marker minor"));
        } else if (style === "swiss") {
          nodes.push(
            isHour
              ? createMarker(angle, 46, 35, "marker major")
              : createMarker(angle, 46, 42, "marker minor"),
          );
        } else {
          nodes.push(
            isHour
              ? createMarker(angle, 46, 40, "marker major")
              : createMarker(angle, 46, 44, "marker minor"),
          );
        }
      }
      markers.replaceChildren(...nodes);
    }

    function rotate(element, angle) {
      element.setAttribute("transform", `rotate(${angle} 50 50)`);
    }

    function render() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      if (settings.showSeconds) rotate(secondHand, seconds * 6);
      // Epoch minute, not minute of the hour: after waking from sleep the hour or date may differ.
      const minuteKey = Math.floor(now.getTime() / 60000);
      if (minuteKey === renderedMinute) return;
      renderedMinute = minuteKey;

      rotate(hourHand, (hours % 12) * 30 + minutes * 0.5);
      rotate(minuteHand, minutes * 6);
      dateText.textContent = String(now.getDate());
      clockTitle.textContent = now.toLocaleTimeString(locale, {
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function applySettings() {
      const style = settings.style || "modern";
      const size = settings.size || "medium";
      const showDate = Boolean(settings.showDate) && !SMALL_SIZES.includes(size);

      app.className = [
        `style-${style}`,
        `size-${size}`,
        `color-${settings.color || "red"}`,
        `align-${settings.horizontalAlignment || "center"}`,
        settings.showSeconds ? "has-seconds" : "",
      ].join(" ");

      drawDial(style, showDate);
      dateGroup.toggleAttribute("hidden", !showDate);
      secondHand.toggleAttribute("hidden", !settings.showSeconds);
      secondTip.toggleAttribute("hidden", style !== "swiss");
      renderedMinute = -1;
    }

    function translate(Homey, key, fallback) {
      const value = Homey.__(`widgets.${WIDGET_ID}.${key}`);
      return value && value !== key ? value : fallback;
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    /** Runs `tick` on every second or minute boundary and pauses while the page is hidden. */
    function createTicker(tick, getInterval) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        const interval = getInterval();
        timer = setTimeout(run, interval - (Date.now() % interval) + 20);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      locale = translate(Homey, "language", navigator.language || "en");
      document.documentElement.lang = locale;

      const reportHeight = createHeightReporter(Homey);
      const ticker = createTicker(render, () => (settings.showSeconds ? SECOND : MINUTE));

      applySettings();
      ticker.start();
      reportHeight();
      new ResizeObserver(reportHeight).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        ticker.start();
      });
    };
    </script>
  </body>
</html>
