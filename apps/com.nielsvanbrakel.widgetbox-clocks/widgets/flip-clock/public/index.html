<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      --unit: 38px;
      --fit: 1;
      --card-bg: #e9e9e9;
      --card-text: var(--homey-text-color, #333);
      --split: var(--homey-background-color, #fff);
      display: flex;
      justify-content: center;
    }

    @supports not (color: color-mix(in srgb, red, blue)) {
      .homey-dark-mode :where(#app) {
        --card-bg: #444;
      }
    }

    @supports (color: color-mix(in srgb, red, blue)) {
      :where(#app) {
        --card-bg: color-mix(
          in srgb,
          var(--homey-text-color, #333) 10%,
          var(--homey-background-color, #fff)
        );
      }
    }

    .align-left {
      justify-content: flex-start;
    }

    .align-right {
      justify-content: flex-end;
    }

    .size-xsmall {
      --unit: 20px;
    }

    .size-small {
      --unit: 28px;
    }

    .size-large {
      --unit: 50px;
    }

    .size-xlarge {
      --unit: 64px;
    }

    .color-blue {
      --card-bg: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --card-bg: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --card-bg: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --card-bg: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --card-bg: var(--homey-color-purple-500, #a855f7);
    }

    #app:not(.color-default) {
      --card-text: var(--homey-color-white, #fff);
    }

    .flip-clock {
      display: flex;
      align-items: center;
      gap: 0.2em;
      font-size: calc(var(--unit) * var(--fit));
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      perspective: 6em;
    }

    .flip-group {
      display: flex;
      gap: 0.08em;
    }

    .colon {
      font-size: 0.8em;
      opacity: 0.6;
    }

    .hide-colons .colon {
      visibility: hidden;
      width: 0.1em;
    }

    .card {
      position: relative;
      width: 1.1em;
      height: 1.5em;
      border-radius: 0.14em;
      color: var(--card-text);
    }

    .card.period {
      width: auto;
      min-width: 1.5em;
      margin-left: 0.15em;
      font-size: 0.55em;
      height: 2.73em;
      border-radius: 0.25em;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: max(1px, 0.04em);
      margin-top: max(-0.5px, -0.02em);
      background: var(--split);
      z-index: 3;
    }

    .half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      background: var(--card-bg);
    }

    .half.top {
      top: 0;
      border-radius: inherit;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      transform-origin: bottom;
    }

    .half.bottom {
      bottom: 0;
      border-radius: inherit;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      transform-origin: top;
    }

    .half span {
      position: absolute;
      left: 0;
      right: 0;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .half.top span {
      top: 0;
    }

    .half.bottom span {
      bottom: 0;
    }

    .card.period .half span {
      padding: 0 0.3em;
    }

    .period-sizer {
      visibility: hidden;
      display: block;
      padding: 0 0.3em;
      line-height: 2.73;
    }

    .flap {
      z-index: 2;
      backface-visibility: hidden;
    }

    .flap.top {
      animation: fold 0.3s ease-in forwards;
    }

    .flap.bottom {
      transform: rotateX(90deg);
      animation: unfold 0.3s ease-out 0.3s forwards;
    }

    @keyframes fold {
      to {
        transform: rotateX(-90deg);
      }
    }

    @keyframes unfold {
      to {
        transform: rotateX(0deg);
      }
    }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="flip-clock" id="flip-clock" role="timer" aria-live="off"></div>
    </div>

    <script>
    const WIDGET_ID = "flip-clock";
    const SECOND = 1000;
    const MINUTE = 60 * SECOND;

    const app = document.getElementById("app");
    const clock = document.getElementById("flip-clock");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let settings = {};
    let locale = "en";
    let periodLabels = { am: "AM", pm: "PM" };
    let cards = {};
    let renderedMinute = -1;

    const pad = (value) => String(value).padStart(2, "0");

    function createHalf(position, value) {
      const half = document.createElement("div");
      half.className = `half ${position}`;
      const span = document.createElement("span");
      span.textContent = value;
      half.appendChild(span);
      return half;
    }

    function createCard(value, extraClass = "") {
      const element = document.createElement("div");
      element.className = `card ${extraClass}`.trim();
      const top = createHalf("top", value);
      const bottom = createHalf("bottom", value);
      element.append(top, bottom);
      if (extraClass === "period") {
        const sizer = document.createElement("span");
        sizer.className = "period-sizer";
        sizer.setAttribute("aria-hidden", "true");
        sizer.textContent =
          periodLabels.am.length >= periodLabels.pm.length ? periodLabels.am : periodLabels.pm;
        element.appendChild(sizer);
      }
      return { element, top, bottom, value, flaps: [] };
    }

    function setHalfText(half, value) {
      half.firstChild.textContent = value;
    }

    function clearFlaps(card) {
      for (const flap of card.flaps) flap.remove();
      card.flaps = [];
      setHalfText(card.bottom, card.value);
    }

    function flipTo(card, value) {
      if (card.value === value) return;
      const previous = card.value;
      clearFlaps(card);
      card.value = value;

      if (reducedMotion.matches || document.hidden) {
        setHalfText(card.top, value);
        setHalfText(card.bottom, value);
        return;
      }

      const flapTop = createHalf("top flap", previous);
      const flapBottom = createHalf("bottom flap", value);
      setHalfText(card.top, value);
      setHalfText(card.bottom, previous);
      flapBottom.addEventListener("animationend", () => clearFlaps(card), { once: true });
      card.flaps = [flapTop, flapBottom];
      card.element.append(flapTop, flapBottom);
    }

    function createColon() {
      const colon = document.createElement("div");
      colon.className = "colon";
      colon.textContent = ":";
      colon.setAttribute("aria-hidden", "true");
      return colon;
    }

    function createGroup(keys, digits) {
      const group = document.createElement("div");
      group.className = "flip-group";
      keys.forEach((key, index) => {
        cards[key] = createCard(digits[index]);
        group.appendChild(cards[key].element);
      });
      return group;
    }

    function getDisplay(now) {
      const hours = now.getHours();
      const is12Hour = settings.clockFormat === "12";
      return {
        hours: pad(is12Hour ? hours % 12 || 12 : hours),
        minutes: pad(now.getMinutes()),
        seconds: pad(now.getSeconds()),
        period: is12Hour ? periodLabels[hours < 12 ? "am" : "pm"] : null,
      };
    }

    function buildClock() {
      const display = getDisplay(new Date());
      cards = {};
      const parts = [
        createGroup(["h1", "h2"], display.hours),
        createColon(),
        createGroup(["m1", "m2"], display.minutes),
      ];
      if (settings.showSeconds) {
        const seconds = createGroup(["s1", "s2"], display.seconds);
        seconds.id = "seconds-group";
        parts.push(createColon(), seconds);
      }
      if (display.period) {
        cards.period = createCard(display.period, "period");
        parts.push(cards.period.element);
      }
      clock.replaceChildren(...parts);
      renderedMinute = -1;
    }

    function render() {
      const now = new Date();
      const display = getDisplay(now);
      flipTo(cards.h1, display.hours[0]);
      flipTo(cards.h2, display.hours[1]);
      flipTo(cards.m1, display.minutes[0]);
      flipTo(cards.m2, display.minutes[1]);
      if (cards.s1) {
        flipTo(cards.s1, display.seconds[0]);
        flipTo(cards.s2, display.seconds[1]);
      }
      if (cards.period) flipTo(cards.period, display.period);

      if (now.getMinutes() === renderedMinute) return;
      renderedMinute = now.getMinutes();
      clock.setAttribute(
        "aria-label",
        now.toLocaleTimeString(locale, {
          hour: "numeric",
          minute: "2-digit",
          hour12: settings.clockFormat === "12",
        }),
      );
    }

    /** Shrinks the clock (never grows it) so it fits the widget width. */
    function fitToWidth() {
      app.style.setProperty("--fit", "1");
      const available = app.clientWidth;
      const natural = clock.scrollWidth;
      const fit = natural > available ? available / natural : 1;
      app.style.setProperty("--fit", fit.toFixed(3));
    }

    function applySettings() {
      app.className = [
        `size-${settings.size || "medium"}`,
        `color-${settings.color || "default"}`,
        `align-${settings.horizontalAlignment || "center"}`,
        settings.showColons === false ? "hide-colons" : "",
      ].join(" ");
      buildClock();
      fitToWidth();
    }

    function translate(Homey, key, fallback) {
      const value = Homey.__(`widgets.${WIDGET_ID}.${key}`);
      return value && value !== key ? value : fallback;
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    /** Runs `tick` on every second or minute boundary and pauses while the page is hidden. */
    function createTicker(tick, getInterval) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        const interval = getInterval();
        timer = setTimeout(run, interval - (Date.now() % interval) + 20);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      locale = translate(Homey, "language", navigator.language || "en");
      periodLabels = { am: translate(Homey, "am", "AM"), pm: translate(Homey, "pm", "PM") };
      document.documentElement.lang = locale;

      const reportHeight = createHeightReporter(Homey);
      const ticker = createTicker(render, () => (settings.showSeconds ? SECOND : MINUTE));

      applySettings();
      ticker.start();
      reportHeight();

      let observedWidth = app.clientWidth;
      new ResizeObserver(() => {
        if (app.clientWidth !== observedWidth) {
          observedWidth = app.clientWidth;
          fitToWidth();
        }
        reportHeight();
      }).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        ticker.start();
      });
    };
    </script>
  </body>
</html>
