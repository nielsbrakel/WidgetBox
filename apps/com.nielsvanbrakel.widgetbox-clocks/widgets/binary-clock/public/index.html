<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      box-sizing: border-box;
      padding: var(--homey-su-3, 12px) var(--homey-su-4, 16px);
      --accent: var(--homey-text-color, #333);
      --unit: 10px;
      --fit: 1;
      --dot: 1.2em;
      --dot-gap: 0.5em;
      --column-length: calc(4 * var(--dot) + 3 * var(--dot-gap));
      display: flex;
      justify-content: center;
    }

    .align-left {
      justify-content: flex-start;
    }

    .align-right {
      justify-content: flex-end;
    }

    .size-xsmall {
      --unit: 6px;
    }

    .size-small {
      --unit: 8px;
    }

    .size-large {
      --unit: 14px;
    }

    .size-xlarge {
      --unit: 18px;
    }

    .color-blue {
      --accent: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --accent: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --accent: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --accent: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --accent: var(--homey-color-purple-500, #a855f7);
    }

    .binary-clock {
      display: flex;
      align-items: flex-end;
      gap: 1.6em;
      font-size: calc(var(--unit) * var(--fit));
      line-height: 1;
    }

    .time-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6em;
    }

    .label {
      font-size: max(11px, 1.2em);
      font-weight: 700;
      opacity: 0.6;
    }

    .hide-labels .label {
      display: none;
    }

    .digits {
      display: flex;
      gap: 0.8em;
    }

    .column {
      display: flex;
      flex-direction: column-reverse;
      gap: var(--dot-gap);
      min-height: var(--column-length);
    }

    .dot {
      width: var(--dot);
      height: var(--dot);
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0.15;
      transition:
        background-color 0.2s ease,
        opacity 0.2s ease;
    }

    .dot.active {
      background-color: var(--accent);
      opacity: 1;
    }

    .period {
      font-size: max(11px, 1.4em);
      font-weight: 700;
      color: var(--accent);
    }

    /* Horizontal: one row per unit, most significant bit on the left. */
    .layout-horizontal .binary-clock {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.8em;
    }

    .layout-horizontal .time-group {
      flex-direction: row;
      gap: 0.8em;
    }

    .layout-horizontal .digits {
      gap: 1.2em;
    }

    .layout-horizontal .label {
      min-width: 1.6em;
      text-align: end;
    }

    .layout-horizontal .column {
      flex-direction: row-reverse;
      min-height: 0;
      min-width: var(--column-length);
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        transition: none;
      }
    }
    </style>
  </head>

  <body class="homey-widget-full">
    <div id="app">
      <div class="binary-clock" id="clock" role="img"></div>
    </div>

    <script>
    const WIDGET_ID = "binary-clock";
    const SECOND = 1000;
    const MINUTE = 60 * SECOND;

    const app = document.getElementById("app");
    const clock = document.getElementById("clock");

    let settings = {};
    let locale = "en";
    const labels = { hours: "H", minutes: "M", seconds: "S", am: "AM", pm: "PM" };
    let columns = [];
    let periodElement = null;
    let renderedMinute = -1;

    const pad = (value) => String(value).padStart(2, "0");

    function createColumn(bits) {
      const element = document.createElement("div");
      element.className = "column";
      const dots = [];
      for (let bit = 0; bit < bits; bit += 1) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dots.push(dot);
        element.appendChild(dot);
      }
      return { element, dots, value: -1 };
    }

    function createGroup(label, unit, bitsPerColumn) {
      const group = document.createElement("div");
      group.className = "time-group";
      const labelElement = document.createElement("div");
      labelElement.className = "label";
      labelElement.textContent = label;
      const digits = document.createElement("div");
      digits.className = "digits";
      bitsPerColumn.forEach((bits, position) => {
        const column = createColumn(bits);
        column.unit = unit;
        column.position = position;
        columns.push(column);
        digits.appendChild(column.element);
      });
      group.append(labelElement, digits);
      return group;
    }

    function buildClock() {
      columns = [];
      const groups = [
        createGroup(labels.hours, "hours", [2, 4]),
        createGroup(labels.minutes, "minutes", [3, 4]),
      ];
      if (settings.showSeconds) groups.push(createGroup(labels.seconds, "seconds", [3, 4]));

      periodElement = null;
      if (settings.clockFormat === "12") {
        const group = document.createElement("div");
        group.className = "time-group";
        periodElement = document.createElement("div");
        periodElement.className = "period";
        group.appendChild(periodElement);
        groups.push(group);
      }
      clock.replaceChildren(...groups);
      renderedMinute = -1;
    }

    function setColumn(column, value) {
      if (column.value === value) return;
      column.value = value;
      column.dots.forEach((dot, bit) => {
        dot.classList.toggle("active", (value & (1 << bit)) !== 0);
      });
    }

    function render() {
      const now = new Date();
      const hours = now.getHours();
      const is12Hour = settings.clockFormat === "12";
      const digits = {
        hours: pad(is12Hour ? hours % 12 || 12 : hours),
        minutes: pad(now.getMinutes()),
        seconds: pad(now.getSeconds()),
      };

      for (const column of columns) {
        setColumn(column, Number(digits[column.unit][column.position]));
      }

      if (now.getMinutes() === renderedMinute) return;
      renderedMinute = now.getMinutes();
      if (periodElement) periodElement.textContent = hours < 12 ? labels.am : labels.pm;
      clock.setAttribute(
        "aria-label",
        now.toLocaleTimeString(locale, { hour: "numeric", minute: "2-digit", hour12: is12Hour }),
      );
    }

    /** Width available to the clock: the #app box minus its padding. */
    function contentWidth(element) {
      const style = getComputedStyle(element);
      return element.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    }

    /** Shrinks the clock (never grows it) so it fits the widget width. */
    function fitToWidth() {
      const available = contentWidth(app);
      let fit = 1;
      app.style.setProperty("--fit", "1");
      // Labels have a minimum font size, so scaling is not linear: refine a few times.
      for (let pass = 0; pass < 3 && clock.scrollWidth > available; pass += 1) {
        fit = Math.floor(fit * (available / clock.scrollWidth) * 1000) / 1000;
        app.style.setProperty("--fit", String(fit));
      }
    }

    function applySettings() {
      app.className = [
        `size-${settings.size || "medium"}`,
        `color-${settings.color || "orange"}`,
        `align-${settings.horizontalAlignment || "center"}`,
        settings.orientation === "vertical" ? "layout-vertical" : "layout-horizontal",
        settings.showLabels === false ? "hide-labels" : "",
      ].join(" ");
      buildClock();
      render();
      fitToWidth();
    }

    function translate(Homey, key, fallback) {
      const value = Homey.__(`widgets.${WIDGET_ID}.${key}`);
      return value && value !== key ? value : fallback;
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    /** Runs `tick` on every second or minute boundary and pauses while the page is hidden. */
    function createTicker(tick, getInterval) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        const interval = getInterval();
        timer = setTimeout(run, interval - (Date.now() % interval) + 20);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      locale = translate(Homey, "language", navigator.language || "en");
      document.documentElement.lang = locale;
      for (const key of Object.keys(labels)) labels[key] = translate(Homey, key, labels[key]);

      const reportHeight = createHeightReporter(Homey);
      const ticker = createTicker(render, () => (settings.showSeconds ? SECOND : MINUTE));

      applySettings();
      ticker.start();
      reportHeight();

      let observedWidth = app.clientWidth;
      new ResizeObserver(() => {
        if (app.clientWidth !== observedWidth) {
          observedWidth = app.clientWidth;
          fitToWidth();
        }
        reportHeight();
      }).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        ticker.start();
      });
    };
    </script>
  </body>
</html>
