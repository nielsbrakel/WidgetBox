<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    html,
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      font-family: var(--homey-font-family, system-ui, sans-serif);
      color: var(--homey-text-color, #333);
    }

    :where(#app) {
      --accent: var(--homey-text-color, #333);
      --time-size: 42px;
      --date-size: 16px;
      --time-weight: normal;
      --fit: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .align-left {
      align-items: flex-start;
      text-align: left;
    }

    .align-right {
      align-items: flex-end;
      text-align: right;
    }

    .size-xsmall {
      --time-size: 20px;
      --date-size: 12px;
    }

    .size-small {
      --time-size: 28px;
      --date-size: 14px;
    }

    .size-large {
      --time-size: 56px;
      --date-size: 20px;
    }

    .size-xlarge {
      --time-size: 72px;
      --date-size: 24px;
    }

    .weight-thin {
      --time-weight: 300;
    }

    .weight-bold {
      --time-weight: bold;
    }

    .color-blue {
      --accent: var(--homey-color-blue-500, #0099ff);
    }

    .color-green {
      --accent: var(--homey-color-green-500, #26c281);
    }

    .color-orange {
      --accent: var(--homey-color-orange-500, #ff9500);
    }

    .color-red {
      --accent: var(--homey-color-red-500, #ff3b30);
    }

    .color-purple {
      --accent: var(--homey-color-purple-500, #a855f7);
    }

    .time {
      font-size: calc(var(--time-size) * var(--fit));
      font-weight: var(--time-weight);
      line-height: 1.1;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .seconds {
      font-size: 0.5em;
      opacity: 0.7;
    }

    .period {
      margin-left: 0.25em;
      font-size: 0.4em;
      opacity: 0.7;
    }

    .seconds:empty,
    .period:empty {
      display: none;
    }

    .date {
      max-width: 100%;
      margin-top: 0.25em;
      font-size: var(--date-size);
      line-height: 1.25;
      opacity: 0.7;
      text-wrap: balance;
    }

    .date[hidden] {
      display: none;
    }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="time" id="time" role="timer" aria-live="off">
        <span id="hours-minutes"></span><span class="seconds" id="seconds"></span
        ><span class="period" id="period"></span>
      </div>
      <div class="date" id="date" hidden></div>
    </div>

    <script>
    const WIDGET_ID = "digital-clock";
    const SECOND = 1000;
    const MINUTE = 60 * SECOND;

    const app = document.getElementById("app");
    const timeElement = document.getElementById("time");
    const hoursMinutesElement = document.getElementById("hours-minutes");
    const secondsElement = document.getElementById("seconds");
    const periodElement = document.getElementById("period");
    const dateElement = document.getElementById("date");

    const DATE_FORMATS = {
      long: { day: "numeric", month: "long", year: "numeric" },
      short: { day: "numeric", month: "short", year: "numeric" },
      "weekday-long": { weekday: "long", day: "numeric", month: "long" },
      "weekday-short": { weekday: "short", day: "numeric", month: "short" },
      "weekday-only": { weekday: "long" },
      "day-month": { day: "numeric", month: "long" },
    };

    let settings = {};
    let locale = "en";
    let periodLabels = { am: "AM", pm: "PM" };
    let renderedDateKey = "";
    let renderedTimeLength = 0;

    const pad = (value) => String(value).padStart(2, "0");

    function formatDate(date) {
      const day = pad(date.getDate());
      const month = pad(date.getMonth() + 1);
      const year = date.getFullYear();
      const format = settings.dateFormat || "weekday-short";
      if (format === "dmy") return `${day}/${month}/${year}`;
      if (format === "mdy") return `${month}/${day}/${year}`;
      if (format === "ymd") return `${year}-${month}-${day}`;
      const text = date.toLocaleDateString(
        locale,
        DATE_FORMATS[format] ?? DATE_FORMATS["weekday-short"],
      );
      return text.charAt(0).toLocaleUpperCase(locale) + text.slice(1);
    }

    function renderDate(now) {
      dateElement.hidden = !settings.showDate;
      if (!settings.showDate) return;
      const key = `${now.toDateString()}:${settings.dateFormat}`;
      if (key === renderedDateKey) return;
      renderedDateKey = key;
      dateElement.textContent = formatDate(now);
    }

    function render() {
      const now = new Date();
      const hours = now.getHours();
      const is12Hour = settings.clockFormat === "12";
      const displayHours = is12Hour ? String(hours % 12 || 12) : pad(hours);
      const hoursMinutes = `${displayHours}:${pad(now.getMinutes())}`;

      hoursMinutesElement.textContent = hoursMinutes;
      secondsElement.textContent = settings.showSeconds ? `:${pad(now.getSeconds())}` : "";
      periodElement.textContent = is12Hour ? periodLabels[hours < 12 ? "am" : "pm"] : "";
      renderDate(now);

      if (hoursMinutes.length !== renderedTimeLength) {
        renderedTimeLength = hoursMinutes.length;
        fitToWidth();
      }
    }

    /** Shrinks the time (never grows it) so it fits the widget width without clipping. */
    function fitToWidth() {
      app.style.setProperty("--fit", "1");
      const available = app.clientWidth;
      const natural = timeElement.scrollWidth;
      const fit = natural > available ? available / natural : 1;
      app.style.setProperty("--fit", fit.toFixed(3));
    }

    function applySettings() {
      app.className = [
        `size-${settings.size || "medium"}`,
        `weight-${settings.fontWeight || "normal"}`,
        `color-${settings.color || "default"}`,
        `align-${settings.horizontalAlignment || "center"}`,
      ].join(" ");
      renderedDateKey = "";
      renderedTimeLength = 0;
    }

    function translate(Homey, key, fallback) {
      const value = Homey.__(`widgets.${WIDGET_ID}.${key}`);
      return value && value !== key ? value : fallback;
    }

    function createHeightReporter(Homey) {
      let reportedHeight = null;
      return () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height === reportedHeight) return;
        if (reportedHeight === null) Homey.ready({ height });
        else Homey.setHeight(height);
        reportedHeight = height;
      };
    }

    /** Runs `tick` on every second or minute boundary and pauses while the page is hidden. */
    function createTicker(tick, getInterval) {
      let timer = null;
      const stop = () => clearTimeout(timer);
      const run = () => {
        tick();
        const interval = getInterval();
        timer = setTimeout(run, interval - (Date.now() % interval) + 20);
      };
      const start = () => {
        stop();
        run();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      return { start };
    }

    window.onHomeyReady = (Homey) => {
      settings = Homey.getSettings();
      locale = translate(Homey, "language", navigator.language || "en");
      periodLabels = { am: translate(Homey, "am", "AM"), pm: translate(Homey, "pm", "PM") };
      document.documentElement.lang = locale;

      const reportHeight = createHeightReporter(Homey);
      const ticker = createTicker(render, () => (settings.showSeconds ? SECOND : MINUTE));

      applySettings();
      ticker.start();
      reportHeight();

      let observedWidth = app.clientWidth;
      new ResizeObserver(() => {
        if (app.clientWidth !== observedWidth) {
          observedWidth = app.clientWidth;
          fitToWidth();
        }
        reportHeight();
      }).observe(app);

      Homey.on("settings.set", (key, value) => {
        settings[key] = value;
        applySettings();
        ticker.start();
      });
    };
    </script>
  </body>
</html>
